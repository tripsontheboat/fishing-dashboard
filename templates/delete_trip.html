{% extends "base.html" %}
{% block content %}

<h2>Delete Trip</h2>

<p>Are you sure you want to delete this trip?</p>

<ul>
    <li><strong>Date:</strong> {{ trip.date }}</li>
    <li><strong>Location:</strong> {{ trip.location }}</li>
    <li><strong>Angler:</strong> {{ trip.angler }}</li>
    <li><strong>Notes:</strong> {{ trip.notes }}</li>
</ul>

<form method="POST">
    <button class="save-btn" style="background:red;">Delete Trip</button>
</form>

{% endblock %}
