{% extends "base.html" %}
{% block content %}

<h1>Edit Line</h1>

<form method="POST">
    <label>Brand:</label><br>
    <input name="brand" value="{{ l.brand }}" required><br><br>

    <label>Model:</label><br>
    <input name="model" value="{{ l.model }}" required><br><br>

    <label>Type:</label><br>
    <input name="type" value="{{ l.type }}"><br><br>

    <label>Strength (lb):</label><br>
    <input name="strength_lb" type="number" value="{{ l.strength_lb }}"><br><br>

    <label>Cost:</label><br>
    <input name="cost" type="number" step="0.01" value="{{ l.cost }}"><br><br>

    <label>Source:</label><br>
    <input name="source" value="{{ l.source }}"><br><br>

    <button class="save-btn">Save Changes</button>
</form>

{% endblock %}
